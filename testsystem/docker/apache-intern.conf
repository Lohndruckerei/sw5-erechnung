# Der Shop lädt manche Inhalte über seine eigene Adresse nach, z. B. das Logo für Rechnungs-PDFs
# (http://localhost:8080/media/...). Im Container zeigt localhost auf den Container selbst, deshalb lauscht
# Apache zusätzlich auf dem Port des Testsystems (HTTP_PORT, Standard 8080).
Listen ${SHOP_INTERNAL_PORT}
<VirtualHost *:${SHOP_INTERNAL_PORT}>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
